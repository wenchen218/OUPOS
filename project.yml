name: oupos
options:
  bundleIdPrefix: app
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: 2
    SUPPORTS_MACCATALYST: NO
targets:
  oupos:
    type: application
    platform: iOS
    sources:
      - path: oupos
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_NAME: oupos
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        PRODUCT_BUNDLE_IDENTIFIER: app.oupos
        INFOPLIST_FILE: oupos/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_CFBundleDisplayName: oupos
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: oupos 需要連線到店內出單機列印訂單。
        INFOPLIST_KEY_NSFaceIDUsageDescription: OUPOS 只會在忘記管理員密碼時使用 Face ID 驗證身分，驗證後可設定新密碼。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIViewControllerBasedStatusBarAppearance: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets:
        - ouposTests
  ouposTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ouposTests
    settings:
      base:
        PRODUCT_NAME: ouposTests
        PRODUCT_MODULE_NAME: ouposTests
        PRODUCT_BUNDLE_IDENTIFIER: app.ouposTests
        GENERATE_INFOPLIST_FILE: YES

